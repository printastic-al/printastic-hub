<!DOCTYPE html>
<html lang="pt-PT">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Printastic Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{

    --bg:#050816;
    --panel:rgba(15,23,42,0.72);
    --border:rgba(255,255,255,0.08);

    --text:#ffffff;
    --muted:#94a3b8;

    --blue:#6366f1;
    --purple:#8b5cf6;
    --cyan:#06b6d4;

}

body{

    font-family:'Inter',sans-serif;

    background:
    radial-gradient(circle at top left,#312e81 0%,transparent 30%),
    radial-gradient(circle at bottom right,#0f766e 0%,transparent 30%),
    #050816;

    color:white;

    min-height:100vh;

    padding:30px;

}

.container{

    max-width:100%;
    margin:auto;

}

.topbar{

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:40px;

    gap:20px;
    flex-wrap:wrap;

}

.logo{

    font-size:42px;
    font-weight:900;

    background:
    linear-gradient(
        90deg,
        white,
        #818cf8,
        #06b6d4
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

}

.search{

    width:340px;
    max-width:100%;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    border-radius:20px;

    padding:16px 20px;

    color:white;

    outline:none;

}

.grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fill,minmax(420px,420px));

    gap:20px;

    align-items:start;

}

.card{

    background:var(--panel);

    border:1px solid var(--border);

    border-radius:30px;

    padding:18px;
    
height:max-content;
    
    backdrop-filter:blur(20px);

    box-shadow:
    0 20px 60px rgba(0,0,0,0.35);

}

.cardTop{

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:15px;

    margin-bottom:20px;

}

.pedidoID{

    font-size:18px;
    font-weight:900;

}

.estado{

    padding:10px 16px;

    border-radius:999px;

    font-size:13px;
    font-weight:700;

    background:rgba(99,102,241,0.15);

    border:1px solid rgba(99,102,241,0.25);

}

.info{

    display:grid;
    gap:8px;
margin-bottom:16px;

}

.infoLine{

    color:#dbeafe;

    line-height:1.6;
font-size:14px;
}

.label{

    color:#94a3b8;
    font-weight:700;

}

.actions{

    display:flex;
    gap:14px;
    flex-wrap:wrap;

}

.btn{

    flex:1;

    border:none;

    padding:16px;

    border-radius:18px;

    cursor:pointer;

    font-weight:800;

    color:white;

    background:
    linear-gradient(
        90deg,
        #6366f1,
        #8b5cf6
    );

}

.btn.secondary{

    background:
    rgba(255,255,255,0.06);

    border:1px solid rgba(255,255,255,0.08);

}

.uploads{

    margin-top:18px;

    background:rgba(255,255,255,0.04);

    border-radius:18px;

    padding:18px;

    max-height:140px;

    overflow:auto;

    white-space:pre-wrap;

    font-size:13px;

    line-height:1.7;

    color:#cbd5e1;

}

.empty{

    text-align:center;
    color:#94a3b8;

    padding:80px 20px;

    font-size:20px;

}

@media(max-width:700px){

    body{

        padding:18px;

    }

    .logo{

        font-size:30px;

    }

}

</style>

</head>

<script>
const ADMIN_USER =
"josealmanso";

const ADMIN_PASS =
"1983Ja1002.";

function fazerLogin(){

    const user =
    document.getElementById(
        "loginUser"
    ).value;

    const pass =
    document.getElementById(
        "loginPass"
    ).value;

    if(
        user === ADMIN_USER &&
        pass === ADMIN_PASS
    ){

        sessionStorage.setItem(
            "printastic_admin",
            "true"
        );

        document.getElementById(
            "loginScreen"
        ).style.display = "none";

    }else{

        alert(
            "Login inválido."
        );

    }

}

if(

    sessionStorage.getItem(
        "printastic_admin"
    ) === "true"

){

    window.addEventListener(
        "load",
        ()=>{

            document.getElementById(
                "loginScreen"
            ).style.display = "none";

        }
    );

}
const API_URL =
"https://script.google.com/macros/s/AKfycbz1pSn2pa3bUHKZrlWBL1_x0ApuPRsYRbtNOBSoV_3S9mOr9Ap4Vb-ILRcs4XFwcT2E/exec";

let pedidos = [];

async function carregarPedidos(){

    const response = await fetch(

        API_URL +
        "?action=listarPedidos"

    );

    pedidos = await response.json();

    renderDashboard();
renderPedidos();

}
function renderDashboard(){

    const novos = pedidos.filter(
        p => p.estado === "Novo"
    ).length;

    const revisao = pedidos.filter(
        p => p.estado === "Em Revisão"
    ).length;

    const producao = pedidos.filter(
        p => p.estado === "Em Produção"
    ).length;

    const totalAtivos = pedidos.filter(
        p => p.estado !== "Concluído"
    ).length;

    document.getElementById(
        "dashboardResumo"
    ).innerHTML = `

        <div style="
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:22px;
            padding:20px;
        ">
            <div style="color:#94a3b8;font-weight:700;">
                Novos
            </div>
            <div style="font-size:34px;font-weight:900;">
                ${novos}
            </div>
        </div>

        <div style="
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:22px;
            padding:20px;
        ">
            <div style="color:#94a3b8;font-weight:700;">
                Em Revisão
            </div>
            <div style="font-size:34px;font-weight:900;">
                ${revisao}
            </div>
        </div>

        <div style="
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:22px;
            padding:20px;
        ">
            <div style="color:#94a3b8;font-weight:700;">
                Em Produção
            </div>
            <div style="font-size:34px;font-weight:900;">
                ${producao}
            </div>
        </div>

        <div style="
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:22px;
            padding:20px;
        ">
            <div style="color:#94a3b8;font-weight:700;">
                Ativos
            </div>
            <div style="font-size:34px;font-weight:900;">
                ${totalAtivos}
            </div>
        </div>

    `;

}
function renderPedidos(){

    const pesquisa =
        document.getElementById(
            "searchInput"
        ).value.toLowerCase();

    let html = "";

    pedidos
.reverse()
.forEach(pedido => {

    if(
        pedido.estado === "Concluído"
    ){

        return;

    }

        const texto =
        JSON.stringify(pedido)
        .toLowerCase();

        if(
            !texto.includes(pesquisa)
        ){

            return;

        }

        html += `

        <div class="card">

            <div class="cardTop">

                <div class="pedidoID">
                    ${pedido.pedidoID}
                </div>

                <div class="estado">
                    ${pedido.estado}
                </div>

            </div>

            <div class="info">

    <div class="infoLine">
        <span class="label">
            Data:
        </span>

        ${
            new Date(pedido.data)
            .toLocaleString("pt-PT")
        }
    </div>

    <div class="infoLine">
        <span class="label">
            Cliente:
        </span>
        ${pedido.nome}
    </div>

                <div class="infoLine">
                    <span class="label">
                        Telemóvel:
                    </span>
                    ${pedido.telemovel}
                </div>

                <div class="infoLine">
                    <span class="label">
                        Tipo:
                    </span>
                    ${pedido.tipoPedido}
                </div>

                <div class="infoLine">
                    <span class="label">
                        Email:
                    </span>
                    ${pedido.email}
                </div>

            </div>

            <div class="actions">

                <button
                    class="btn"
                    onclick="abrirCanva('${pedido.canvaLink}')"
                >
                    🎨 Canva
                </button>

                <button
                    class="btn secondary"
                    onclick="toggleUploads(this)"
                >
                    ☁️ Uploads
                </button>

            </div>

            <div
                class="uploads"
                style="display:none;"
            >

${pedido.uploads || "Sem uploads"}

            </div>
<div style="
margin-top:20px;
padding-top:20px;
border-top:1px solid rgba(255,255,255,0.08);
">
${pedido.usarRecompensa === "SIM" ? `

<div style="
margin-bottom:20px;
padding:22px;
border-radius:20px;
background:linear-gradient(135deg,#6d28d9,#7c3aed);
border:1px solid rgba(255,255,255,.15);

margin-bottom:16px;

</div>

<div style="margin-bottom:8px;">

${pedido.recompensaPedida}

</div>

<div style="margin-bottom:8px;">

⭐ ${pedido.pontosCliente || 0} pontos

</div>

<div style="margin-bottom:8px;">

${pedido.estadoRecompensa || "Por Validar"}

</div>

<div style="
margin-top:10px;
font-size:14px;
line-height:1.6;
">

${infoRecompensa(pedido)}

</div>
${pedido.estadoRecompensa === "Validada" || pedido.estadoRecompensa === "Recusada" ? `

<div style="
margin-top:18px;
padding:14px;
border-radius:14px;
background:rgba(255,255,255,0.12);
font-weight:900;
text-align:center;
">

${pedido.estadoRecompensa === "Validada" ? "✅ Recompensa já validada" : "❌ Recompensa já recusada"}

</div>

` : `

<div style="
display:flex;
gap:10px;
margin-top:18px;
">

${podeValidarRecompensa(pedido) ? `

<button
    onclick="atualizarRecompensa('${pedido.pedidoID}','Validada')"
    style="
        flex:1;
        border:none;
        padding:14px;
        border-radius:14px;
        cursor:pointer;
        font-weight:900;
        color:white;
        background:#22c55e;
    "
>
    ✅ Validar
</button>

` : `

<button
    disabled
    style="
        flex:1;
        border:none;
        padding:14px;
        border-radius:14px;
        font-weight:900;
        color:#94a3b8;
        background:#374151;
        cursor:not-allowed;
    "
>
    🚫 Pontos insuficientes
</button>

`}

<button
    onclick="recusarRecompensa('${pedido.pedidoID}')"
    style="
        flex:1;
        border:none;
        padding:14px;
        border-radius:14px;
        cursor:pointer;
        font-weight:900;
        color:white;
        background:#ef4444;
    "
>
    ❌ Recusar
</button>

</div>

`}
</div>

` : ""}

    margin-bottom:18px;
    padding:14px;
    border-radius:16px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    color:#cbd5e1;
    font-size:14px;
    line-height:1.6;
">

    <strong style="color:white;">
        Observações do Cliente:
    </strong>

    <br>

    ${pedido.observacoes || "Sem observações."}

</div>
<label style="
display:block;
margin-bottom:10px;
font-weight:700;
">
Estado
</label>

<select

    ${pedido.estado === "Concluído"
    ? "disabled"
    : ""}

    class="estadoSelect"
    data-id="${pedido.pedidoID}"
    style="
        width:100%;
        margin-bottom:18px;
        background:rgba(255,255,255,0.05);
        border:1px solid rgba(255,255,255,0.08);
        border-radius:16px;
        padding:16px;
        color:white;
    "
>

    <option value="Novo"
    ${pedido.estado === "Novo" ? "selected" : ""}
    >
        Novo
    </option>
<option value="Em Revisão"
${pedido.estado === "Em Revisão" ? "selected" : ""}
>
    Em Revisão
</option>
    <option value="Em Produção"
    ${pedido.estado === "Em Produção" ? "selected" : ""}
    >

    </option>

    <option value="Concluído"

    >

    </option>

</select>

</label>

    ? "disabled"
    : ""}

    class="obsInternas"
    data-id="${pedido.pedidoID}"
    style="
        width:100%;
        min-height:120px;
        margin-bottom:18px;

    "
>${pedido.observacoesInternas || ""}</textarea>

Mensagem para o Cliente

    data-id="${pedido.pedidoID}"

    "
>${pedido.observacoesCliente || ""}</textarea>

<button

    ${pedido.estado === "Concluído"
    ? "disabled"
    : ""}

    onclick="guardarEstado('${pedido.pedidoID}')"

        width:100%;
        border:none;
        padding:16px;
        border-radius:16px;
        cursor:pointer;
        font-weight:800;
        color:white;
        background:
        linear-gradient(
            90deg,
            #6366f1,
            #8b5cf6
        );
    "
>

    💾 Guardar Estado

</button>

<div style="
margin-top:20px;
padding:18px;
border-radius:18px;
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.08);
">

<h3 style="margin-bottom:16px;">
⭐ Printastic Points
</h3>

<label>
Metros produzidos
</label>

<input
type="number"
min="0"
step="1"
class="metrosProduzidos"

data-nome="${pedido.nome}"

color:white;
">

<button
onclick="atribuirPontos('${pedido.email}','${pedido.nome}','${pedido.pedidoID}',this)"
style="
width:100%;
border:none;
padding:16px;
border-radius:16px;
cursor:pointer;
font-weight:800;
color:white;
background:linear-gradient(90deg,#f59e0b,#f97316);
">

⭐ Atribuir Pontos

</button>

</div>
<button
    onclick="enviarWhatsapp('${pedido.pedidoID}')"
    style="
        width:100%;
        margin-top:10px;
        border:none;
        padding:16px;
        border-radius:16px;
        cursor:pointer;
        font-weight:800;
        color:white;
        background:
        linear-gradient(
            90deg,
            #22c55e,
            #14b8a6
        );
    "
>

    💬 Enviar WhatsApp

</button>
<button
    onclick="gerarEtiqueta('${pedido.pedidoID}')"
    style="
        width:100%;
        margin-top:10px;
        border:none;
        padding:16px;
        border-radius:16px;
        cursor:pointer;
        font-weight:800;
        color:white;
        background:
        linear-gradient(
            90deg,
            #f59e0b,
            #f97316
        );
    "
>

    🏷️ Gerar Etiqueta

</button>
</div>
        </div>

        `;

    });

    if(html === ""){

        html = `
        <div class="empty">
            Nenhum pedido encontrado.
        </div>
        `;

    }

    document.getElementById(
        "pedidosGrid"
    ).innerHTML = html;

}

function abrirCanva(link){

    if(!link){

        alert(
            "Este pedido não tem link Canva."
        );

        return;

    }

    window.open(
        link,
        "_blank"
    );

}

function toggleUploads(btn){

    const box =
    btn.parentElement.nextElementSibling;

    if(
        box.style.display === "none"
    ){

        box.style.display = "block";

    }else{

        box.style.display = "none";

    }

}

document.getElementById(
    "searchInput"
).addEventListener(
    "input",
    renderPedidos
);
function guardarEstado(pedidoID){

    const estado = document.querySelector(
        `.estadoSelect[data-id="${pedidoID}"]`
    ).value;

    const observacoesInternas = document.querySelector(
        `.obsInternas[data-id="${pedidoID}"]`
    ).value;
const observacoesCliente = document.querySelector(
    `.obsCliente[data-id="${pedidoID}"]`
).value;
    fetch(API_URL,{

        method:"POST",

        body:JSON.stringify({

            action:"atualizarEstado",

            pedidoID:pedidoID,

            estado:estado,

            observacoesInternas:observacoesInternas,
observacoesCliente:observacoesCliente

        })

    })
    .then(()=>{

        alert("Estado atualizado.");

        carregarPedidos();

    })
    .catch(()=>{

        alert("Erro ao atualizar estado.");

    });

}
function atualizarRecompensa(pedidoID, estado, motivo){

    fetch(API_URL,{

        method:"POST",

        body:JSON.stringify({

            action:"atualizarRecompensa",

            pedidoID:pedidoID,

            estadoRecompensa:estado,

            motivoRecompensa:motivo || ""

        })

    })

    .then(r=>r.json())

    .then(res=>{

        if(res.success){

            alert("Estado da recompensa atualizado.");

            carregarPedidos();

        }else{

            alert(res.error || "Erro ao atualizar recompensa.");

        }

    })

    .catch(()=>{

        alert("Erro ao atualizar recompensa.");

    });

}

function atribuirPontos(email,nome,pedidoID,botao){

    const input = botao.parentElement.querySelector(".metrosProduzidos");

    const metros = parseInt(input.value);

    if(isNaN(metros) || metros <= 0){

        alert("Indica os metros completos produzidos.");

        return;

    }

    fetch(API_URL,{

        method:"POST",

        body:JSON.stringify({

            action:"atualizarPontos",

            email:email,

            nome:nome,

            pontos:metros,

pedidoID:pedidoID

        })

    })

    .then(r=>r.json())

    .then(res=>{

        if(res.success){

            alert("Pontos atribuídos com sucesso.");

            input.value="";

        }else{

            alert("Erro ao atribuir pontos.");

        }

    })

    .catch(()=>{

        alert("Erro ao comunicar com o servidor.");

    });

}
function infoRecompensa(pedido){

    let necessarios = 0;

    if(pedido.recompensaPedida === "1 metro grátis"){
        necessarios = 10;
    }

    if(pedido.recompensaPedida === "3 metros grátis"){
        necessarios = 20;
    }

    if(pedido.recompensaPedida === "5 metros grátis"){
        necessarios = 30;
    }

    const pontos = Number(pedido.pontosCliente || 0);

    if(!necessarios){
        return "";
    }

    if(pontos >= necessarios){

        return `
            ✅ Pode validar esta recompensa.<br>
            Necessários: ${necessarios} pontos<br>
            Após validar ficará com: ${pontos - necessarios} pontos
        `;

    }

    return `
        ❌ Pontos insuficientes.<br>
        Necessários: ${necessarios} pontos<br>
        Faltam: ${necessarios - pontos} pontos
    `;

}
function podeValidarRecompensa(pedido){

    let necessarios = 0;

    if(pedido.recompensaPedida === "1 metro grátis"){
        necessarios = 10;
    }

    if(pedido.recompensaPedida === "3 metros grátis"){
        necessarios = 20;
    }

    if(pedido.recompensaPedida === "5 metros grátis"){
        necessarios = 30;
    }

    return Number(pedido.pontosCliente || 0) >= necessarios;

}
