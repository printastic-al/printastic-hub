<!DOCTYPE html>
<html lang="pt-PT">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Printastic Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{

    --bg:#050816;
    --panel:rgba(15,23,42,0.72);
    --border:rgba(255,255,255,0.08);

    --text:#ffffff;
    --muted:#94a3b8;

    --blue:#6366f1;
    --purple:#8b5cf6;
    --cyan:#06b6d4;

}

body{

    font-family:'Inter',sans-serif;

    background:
    radial-gradient(circle at top left,#312e81 0%,transparent 30%),
    radial-gradient(circle at bottom right,#0f766e 0%,transparent 30%),
    #050816;

    color:white;

    min-height:100vh;

    padding:30px;

}

.container{

    max-width:100%;
    margin:auto;

}

.topbar{

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:40px;

    gap:20px;
    flex-wrap:wrap;

}

.logo{

    font-size:42px;
    font-weight:900;

    background:
    linear-gradient(
        90deg,
        white,
        #818cf8,
        #06b6d4
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

}

.search{

    width:340px;
    max-width:100%;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    border-radius:20px;

    padding:16px 20px;

    color:white;

    outline:none;

}

.grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fill,minmax(420px,420px));

    gap:20px;

    align-items:start;

}

.card{

    background:var(--panel);

    border:1px solid var(--border);

    border-radius:30px;

    padding:18px;
    
height:max-content;
    
    backdrop-filter:blur(20px);

    box-shadow:
    0 20px 60px rgba(0,0,0,0.35);

}

.cardTop{

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:15px;

    margin-bottom:20px;

}

.pedidoID{

    font-size:18px;
    font-weight:900;

}

.estado{

    padding:10px 16px;

    border-radius:999px;

    font-size:13px;
    font-weight:700;

    background:rgba(99,102,241,0.15);

    border:1px solid rgba(99,102,241,0.25);

}

.info{

    display:grid;
    gap:8px;
margin-bottom:16px;

}

.infoLine{

    color:#dbeafe;

    line-height:1.6;
font-size:14px;
}

.label{

    color:#94a3b8;
    font-weight:700;

}

.actions{

    display:flex;
    gap:14px;
    flex-wrap:wrap;

}

.btn{

    flex:1;

    border:none;

    padding:16px;

    border-radius:18px;

    cursor:pointer;

    font-weight:800;

    color:white;

    background:
    linear-gradient(
        90deg,
        #6366f1,
        #8b5cf6
    );

}

.btn.secondary{

    background:
    rgba(255,255,255,0.06);

    border:1px solid rgba(255,255,255,0.08);

}

.uploads{

    margin-top:18px;

    background:rgba(255,255,255,0.04);

    border-radius:18px;

    padding:18px;

    max-height:140px;

    overflow:auto;

    white-space:pre-wrap;

    font-size:13px;

    line-height:1.7;

    color:#cbd5e1;

}

.empty{

    text-align:center;
    color:#94a3b8;

    padding:80px 20px;

    font-size:20px;

}

@media(max-width:700px){

    body{

        padding:18px;

    }

    .logo{

        font-size:30px;

    }

}

</style>

</head>

<body>

<div id="loginScreen" style="
position:fixed;
inset:0;
background:#050816;
display:flex;
align-items:center;
justify-content:center;
z-index:999999;
padding:20px;
">

<div style="
width:100%;
max-width:420px;
background:rgba(15,23,42,0.92);
border:1px solid rgba(255,255,255,0.08);
border-radius:34px;
padding:40px;
backdrop-filter:blur(20px);
">

<div style="
font-size:38px;
font-weight:900;
margin-bottom:10px;
text-align:center;
background:
linear-gradient(
90deg,
white,
#818cf8,
#06b6d4
);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
">
PRINTASTIC ADMIN
</div>

<div style="
text-align:center;
color:#94a3b8;
margin-bottom:30px;
">
Área privada
</div>

<input
type="text"
id="loginUser"
placeholder="Utilizador"
style="
width:100%;
margin-bottom:18px;
padding:18px;
border-radius:18px;
border:1px solid rgba(255,255,255,0.08);
background:rgba(255,255,255,0.05);
color:white;
font-size:16px;
"
>

<input
type="password"
id="loginPass"
placeholder="Password"
style="
width:100%;
margin-bottom:22px;
padding:18px;
border-radius:18px;
border:1px solid rgba(255,255,255,0.08);
background:rgba(255,255,255,0.05);
color:white;
font-size:16px;
"
>

<button
onclick="fazerLogin()"
style="
width:100%;
border:none;
padding:18px;
border-radius:18px;
font-size:17px;
font-weight:800;
cursor:pointer;
color:white;
background:
linear-gradient(
90deg,
#6366f1,
#8b5cf6,
#06b6d4
);
"
>

Entrar

</button>

</div>

</div>

<div class="container">

    <div class="topbar">

       <div style="
display:flex;
align-items:center;
gap:16px;
flex-wrap:wrap;
">

    <div class="logo">
        PRINTASTIC ADMIN
    </div>

    <button
        onclick="sairAdmin()"
        style="
            border:none;
            padding:12px 18px;
            border-radius:14px;
            cursor:pointer;
            font-weight:800;
            color:white;
            background:
            rgba(255,255,255,0.08);
            border:1px solid rgba(255,255,255,0.08);
        "
    >

        🚪 Sair

    </button>

</div>

        <input
            type="text"
            class="search"
            id="searchInput"
            placeholder="Pesquisar cliente ou pedido..."
        >

    </div>

    <div
        class="grid"
        id="pedidosGrid"
    ></div>

</div>

<script>
const ADMIN_USER =
"josealmanso";

const ADMIN_PASS =
"1983Ja1002.";

function fazerLogin(){

    const user =
    document.getElementById(
        "loginUser"
    ).value;

    const pass =
    document.getElementById(
        "loginPass"
    ).value;

    if(
        user === ADMIN_USER &&
        pass === ADMIN_PASS
    ){

        sessionStorage.setItem(
            "printastic_admin",
            "true"
        );

        document.getElementById(
            "loginScreen"
        ).style.display = "none";

    }else{

        alert(
            "Login inválido."
        );

    }

}

if(

    sessionStorage.getItem(
        "printastic_admin"
    ) === "true"

){

    window.addEventListener(
        "load",
        ()=>{

            document.getElementById(
                "loginScreen"
            ).style.display = "none";

        }
    );

}
const API_URL =
"https://script.google.com/macros/s/AKfycbz1pSn2pa3bUHKZrlWBL1_x0ApuPRsYRbtNOBSoV_3S9mOr9Ap4Vb-ILRcs4XFwcT2E/exec";

let pedidos = [];

async function carregarPedidos(){

    const response = await fetch(

        API_URL +
        "?action=listarPedidos"

    );

    pedidos = await response.json();

    renderPedidos();

}

function renderPedidos(){

    const pesquisa =
        document.getElementById(
            "searchInput"
        ).value.toLowerCase();

    let html = "";

    pedidos
.reverse()
.forEach(pedido => {

    if(
        pedido.estado === "Concluído"
    ){

        return;

    }

        const texto =
        JSON.stringify(pedido)
        .toLowerCase();

        if(
            !texto.includes(pesquisa)
        ){

            return;

        }

        html += `

        <div class="card">

            <div class="cardTop">

                <div class="pedidoID">
                    ${pedido.pedidoID}
                </div>

                <div class="estado">
                    ${pedido.estado}
                </div>

            </div>

            <div class="info">

                <div class="infoLine">
                    <span class="label">
                        Cliente:
                    </span>
                    ${pedido.nome}
                </div>

                <div class="infoLine">
                    <span class="label">
                        Telemóvel:
                    </span>
                    ${pedido.telemovel}
                </div>

                <div class="infoLine">
                    <span class="label">
                        Tipo:
                    </span>
                    ${pedido.tipoPedido}
                </div>

                <div class="infoLine">
                    <span class="label">
                        Email:
                    </span>
                    ${pedido.email}
                </div>

            </div>

            <div class="actions">

                <button
                    class="btn"
                    onclick="abrirCanva('${pedido.canvaLink}')"
                >
                    🎨 Canva
                </button>

                <button
                    class="btn secondary"
                    onclick="toggleUploads(this)"
                >
                    ☁️ Uploads
                </button>

            </div>

            <div
                class="uploads"
                style="display:none;"
            >

${pedido.uploads || "Sem uploads"}

            </div>
<div style="
margin-top:20px;
padding-top:20px;
border-top:1px solid rgba(255,255,255,0.08);
">

<label style="
display:block;
margin-bottom:10px;
font-weight:700;
">
Estado
</label>

<select

    ${pedido.estado === "Concluído"
    ? "disabled"
    : ""}

    class="estadoSelect"
    data-id="${pedido.pedidoID}"
    style="
        width:100%;
        margin-bottom:18px;
        background:rgba(255,255,255,0.05);
        border:1px solid rgba(255,255,255,0.08);
        border-radius:16px;
        padding:16px;
        color:white;
    "
>

    <option value="Novo"
    ${pedido.estado === "Novo" ? "selected" : ""}
    >
        Novo
    </option>

    <option value="Em Produção"
    ${pedido.estado === "Em Produção" ? "selected" : ""}
    >
        Em Produção
    </option>

    <option value="Concluído"
    ${pedido.estado === "Concluído" ? "selected" : ""}
    >
        Concluído
    </option>

</select>

<label style="
display:block;
margin-bottom:10px;
font-weight:700;
">
Observações Internas
</label>

<textarea

    ${pedido.estado === "Concluído"
    ? "disabled"
    : ""}

    class="obsInternas"
    data-id="${pedido.pedidoID}"
    style="
        width:100%;
        min-height:120px;
        margin-bottom:18px;
        background:rgba(255,255,255,0.05);
        border:1px solid rgba(255,255,255,0.08);
        border-radius:16px;
        padding:16px;
        color:white;
    "
>${pedido.observacoesInternas || ""}</textarea>

<button

    ${pedido.estado === "Concluído"
    ? "disabled"
    : ""}

    onclick="guardarEstado('${pedido.pedidoID}')"
    style="
        width:100%;
        border:none;
        padding:16px;
        border-radius:16px;
        cursor:pointer;
        font-weight:800;
        color:white;
        background:
        linear-gradient(
            90deg,
            #6366f1,
            #8b5cf6
        );
    "
>

    💾 Guardar Estado

</button>

</div>
        </div>

        `;

    });

    if(html === ""){

        html = `
        <div class="empty">
            Nenhum pedido encontrado.
        </div>
        `;

    }

    document.getElementById(
        "pedidosGrid"
    ).innerHTML = html;

}

function abrirCanva(link){

    if(!link){

        alert(
            "Este pedido não tem link Canva."
        );

        return;

    }

    window.open(
        link,
        "_blank"
    );

}

function toggleUploads(btn){

    const box =
    btn.parentElement.nextElementSibling;

    if(
        box.style.display === "none"
    ){

        box.style.display = "block";

    }else{

        box.style.display = "none";

    }

}

document.getElementById(
    "searchInput"
).addEventListener(
    "input",
    renderPedidos
);
async function guardarEstado(pedidoID){

    const estado = document.querySelector(

        `.estadoSelect[data-id="${pedidoID}"]`

    ).value;

    const observacoesInternas = document.querySelector(

        `.obsInternas[data-id="${pedidoID}"]`

    ).value;

    await fetch(API_URL,{

        method:"POST",

        body:JSON.stringify({

            action:"atualizarEstado",

            pedidoID,

            estado,

            observacoesInternas

        })

    });

 alert(
    "Estado atualizado."
);

if(estado === "Concluído"){

    const pedido = pedidos.find(
        p => p.pedidoID === pedidoID
    );

    if(pedido && pedido.telemovel){

        const telefone =
            "351" + pedido.telemovel
            .replace(/\D/g,"");

        const mensagem =
            `Olá ${pedido.nome}, o teu pedido ${pedidoID} está concluído. A equipa Printastic irá entrar em contacto contigo para combinar a entrega. Obrigado!`;

        const url =
            "https://wa.me/" +
            telefone +
            "?text=" +
            encodeURIComponent(mensagem);

        window.open(
            url,
            "_blank"
        );

    }

}

carregarPedidos();

}

function sairAdmin(){

    sessionStorage.removeItem(
        "printastic_admin"
    );

    window.location.href =
    "index.html";

}

carregarPedidos();

</script>

</body>
</html>
